<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Validation requise</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
                <tr>
                    <td style="background:#0b5fff;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:bold;">
                        Tadbir Budget
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;">
                        <p style="margin:0 0 16px;font-size:16px;">
                            Bonjour <span th:text="${recipientName}">collègue</span>,
                        </p>
                        <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                            Une requête attend votre validation à l'étape
                            « <strong th:text="${stepName}">Validation</strong> ».
                        </p>
                        <table role="presentation" cellpadding="0" cellspacing="0"
                               style="margin:0 0 16px;font-size:14px;">
                            <tr>
                                <td style="padding:4px 12px 4px 0;color:#7b8794;">Requête&nbsp;:</td>
                                <td style="padding:4px 0;"><strong th:text="${requestNumber}">REF</strong></td>
                            </tr>
                            <tr th:if="${dueAt != null}">
                                <td style="padding:4px 12px 4px 0;color:#7b8794;">Échéance&nbsp;:</td>
                                <td style="padding:4px 0;" th:text="${dueAt}">—</td>
                            </tr>
                        </table>
                        <p style="margin:0;font-size:14px;line-height:1.5;color:#52606d;">
                            Connectez-vous à l'application pour traiter cette demande depuis votre boîte de réception.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:18px 28px;background:#f4f5f7;font-size:12px;color:#9aa5b1;">
                        Message automatique — merci de ne pas y répondre.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
