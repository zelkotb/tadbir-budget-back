server:
  port: 8080

spring:
  datasource:
    url: "jdbc:postgresql://127.0.0.1:5432/TADBIR_BUDGET"
    username: "postgres"
    password: "admin"
    hikari:
      minimum-idle: 2
      maximum-pool-size: 2
  liquibase:
    contexts: dev

app:
  cookie:
    secure: false   # localhost doesn't require HTTPS

rate-limit:
  enabled: true    # disabled in dev — no throttling on localhost
