server:
  port: ${APP_PORT}
  tomcat:
    max-threads: ${MAX_THREADS}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: ${MIN_IDLE}
      maximum-pool-size: ${MAX_IDLE}
  liquibase:
    contexts: prod

management:
  endpoint:
    health:
      show-details: never   # never expose DB/disk details to anonymous users

lockout:
  max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  auth:
    capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
    refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:5}
    refill-seconds: ${RATE_LIMIT_AUTH_REFILL_SECONDS:60}
  api:
    capacity: ${RATE_LIMIT_API_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_API_REFILL_TOKENS:100}
    refill-seconds: ${RATE_LIMIT_API_REFILL_SECONDS:60}
